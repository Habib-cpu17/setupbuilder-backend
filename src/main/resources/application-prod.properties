# ===== Production (Render) — all values from env vars =====
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== CORS =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://frontend-ponc.onrender.com}

# ===== Component images (public backend URL so browsers can load them) =====
app.image-base-url=${APP_BASE_URL:https://setupbuilder-backend.onrender.com}