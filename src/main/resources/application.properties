
spring.application.name=setupbuilder-backend

# ===== Server =====
server.port=${PORT:8080}

# ===== Database (values supplied by profile-specific files) =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== Jackson =====
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# ===== Pricing =====
pricing.provider=mock
pricing.refresh.cron=0 0 3 * * *
pricing.refresh.enabled=true

# ===== Gemini AI =====
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models
gemini.api.models=gemini-flash-latest,gemini-flash-lite-latest
gemini.api.retries=2

# ===== File Uploads =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=uploads
app.upload.avatar-max-size=2097152
app.upload.banner-max-size=5242880

# ===== Admin bootstrap =====
app.admin.emails=${ADMIN_EMAILS:}

# ===== CORS (comma-separated origins) =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}