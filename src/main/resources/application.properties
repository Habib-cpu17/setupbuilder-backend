spring.application.name=setupbuilder-backend

# ===== Server =====
# On Render: PORT env var is used automatically. Locally: falls back to 8080.
server.port=${PORT:8080}

# ===== Database =====
# All values come from env vars (Render) or application-local.properties (laptop).
# Never hardcode credentials here.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Jackson =====
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# ===== Pricing =====
pricing.provider=mock
pricing.refresh.cron=0 0 3 * * *
pricing.refresh.enabled=true

# ===== Gemini AI =====
gemini.api.key=${GEMINI_API_KEY}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models
gemini.api.models=gemini-flash-latest,gemini-flash-lite-latest
gemini.api.retries=2

# ===== File Uploads =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=uploads
app.upload.avatar-max-size=2097152
app.upload.banner-max-size=5242880

# ===== Profiles =====
# Do NOT activate 'local' here — it breaks on Render.
# Locally, launch with: -Dspring.profiles.active=local